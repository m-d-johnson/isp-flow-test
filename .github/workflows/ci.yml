name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:          # the release workflow runs this first

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Ruff
        run: uvx ruff check .
      - name: Shell syntax
        run: bash -n tests/lab/ecmp-lab.sh

  test:
    # Unit tests, real sockets against a local server (including the kernel TCP statistics on
    # each OS), synthetic captures and the report pipeline, on the oldest and newest Pythons.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install tshark
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q tshark
      - name: Tests
        run: >-
          uv run --no-project --python ${{ matrix.python }}
          --with pytest --with hypothesis --with scapy --with rich --with certifi
          python -m pytest -m "not lab" -v -p no:cacheprovider

  lab:
    # End to end in network namespaces with a real ECMP split and one rate-limited member:
    # proves the tool detects the fault it was built for (tests/lab/ecmp-lab.sh).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install network tools
        run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q scamper tshark traceroute tcpdump iproute2
      - name: Python environment
        run: |
          uv venv --python 3.12 /tmp/venv
          uv pip install --python /tmp/venv/bin/python pytest scapy rich certifi
      - name: Lab tests
        run: sudo ISP_FLOW_LAB=1 /tmp/venv/bin/python -m pytest -m lab -v -p no:cacheprovider
      - name: Upload the lab's report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lab-report
          path: /tmp/isp-flow-lab
          if-no-files-found: ignore
