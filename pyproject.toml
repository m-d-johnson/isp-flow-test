# Tooling configuration only. The tool itself is the single file isp-flow-test.py, with its
# dependencies declared inline (PEP 723); there is no package to build.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = ["lab: end-to-end in a network-namespace ECMP lab (Linux, root, ISP_FLOW_LAB=1)"]

[tool.ruff]
line-length = 130
target-version = "py39"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "UP"]
